<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <style>
    :root { --bg: #000; --fg: #39ff14; }
    :root[data-theme="light"] { --bg: #fff; --fg: #1e5bff; }
    :root[data-game="snake"] { --bg: #000; --fg: #ff8c00; }
    :root[data-game="snake"] #theme { display: none; } /* snake has one look */
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 100px; /* at least 100px on each side */
      box-sizing: border-box;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      aspect-ratio: 4 / 3;
      background: var(--bg);
      cursor: none;
    }
    #controls {
      position: fixed;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
    }
    #controls button {
      padding: 6px 10px;
      font: 14px monospace;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--fg);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.7;
    }
    #controls button:hover { opacity: 1; }
    @media (max-width: 720px) {
      body { padding: 0 24px; }
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="game-btn" type="button" title="Switch game">Play Snake</button>
    <button id="theme" type="button" title="Switch theme (T)">Theme</button>
  </div>
  <canvas id="game" width="800" height="600"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Themes: black/green (default) and white/blue. Switch with the button or the T key.
    const THEMES = {
      dark:  { bg: '#000', fg: '#39ff14', dim: 'rgba(57, 255, 20, 0.35)', overlay: 'rgba(0, 0, 0, 0.6)' },
      light: { bg: '#fff', fg: '#1e5bff', dim: 'rgba(30, 91, 255, 0.35)', overlay: 'rgba(255, 255, 255, 0.6)' }
    };
    let themeName = 'dark';
    try { if (localStorage.getItem('pong-theme') === 'light') themeName = 'light'; } catch (e) {}
    let theme = THEMES[themeName];

    function applyTheme(name) {
      themeName = name;
      theme = THEMES[name];
      document.documentElement.dataset.theme = name;
      try { localStorage.setItem('pong-theme', name); } catch (e) {}
    }
    function toggleTheme() {
      applyTheme(themeName === 'dark' ? 'light' : 'dark');
      if (state !== 'playing') draw(); // repaint right away when the game is paused
    }
    applyTheme(themeName);

    const themeBtn = document.getElementById('theme');
    themeBtn.addEventListener('click', () => { toggleTheme(); themeBtn.blur(); });

    const PADDLE_W = 12;
    const PADDLE_H = 100;
    const PADDLE_SPEED = 7;
    const BALL_SIZE = 12;
    const WIN_SCORE = 7;

    const player = { x: W - 30 - PADDLE_W, y: H / 2 - PADDLE_H / 2, score: 0 };
    const ai     = { x: 30,                y: H / 2 - PADDLE_H / 2, score: 0 };
    const ball   = { x: W / 2, y: H / 2, vx: 0, vy: 0 };

    let currentGame = 'pong'; // pong | snake
    let state = 'ready'; // pong: ready | playing | over
    let keys = {};
    let mouseY = null;
    let winner = null;

    function resetBall(direction) {
      ball.x = W / 2;
      ball.y = H / 2;
      const angle = (Math.random() * 0.6 - 0.3);
      const speed = 6;
      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function startGame() {
      player.score = 0;
      ai.score = 0;
      winner = null;
      resetBall(Math.random() < 0.5 ? 1 : -1);
      state = 'playing';
    }

    // Controls: mouse or arrow keys move the right paddle. Space starts or restarts.
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseY = ((e.clientY - rect.top) / rect.height) * H;
    });
    canvas.addEventListener('mouseleave', () => { mouseY = null; });
    canvas.addEventListener('click', () => {
      if (currentGame === 'snake') { if (sState !== 'playing') snakeStart(); }
      else if (state !== 'playing') startGame();
    });

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (currentGame === 'snake') { if (sState !== 'playing') snakeStart(); }
        else if (state !== 'playing') startGame();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
      if (currentGame === 'snake') {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') snakeTurn(0, -1);
        else if (k === 'arrowdown' || k === 's') snakeTurn(0, 1);
        else if (k === 'arrowleft' || k === 'a') snakeTurn(-1, 0);
        else if (k === 'arrowright' || k === 'd') snakeTurn(1, 0);
      } else if ((e.key === 't' || e.key === 'T') && !e.repeat) {
        toggleTheme();
      }
    });
    document.addEventListener('keyup', (e) => { keys[e.key] = false; });

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function update() {
      if (state !== 'playing') return;

      // Player paddle
      if (mouseY !== null) {
        player.y = mouseY - PADDLE_H / 2;
      } else {
        if (keys['ArrowUp'])   player.y -= PADDLE_SPEED;
        if (keys['ArrowDown']) player.y += PADDLE_SPEED;
      }
      player.y = clamp(player.y, 0, H - PADDLE_H);

      // AI paddle: follows the ball with a slight lag
      const aiCenter = ai.y + PADDLE_H / 2;
      const aiSpeed = 4.5;
      if (aiCenter < ball.y - 10) ai.y += aiSpeed;
      else if (aiCenter > ball.y + 10) ai.y -= aiSpeed;
      ai.y = clamp(ai.y, 0, H - PADDLE_H);

      // Ball movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top and bottom walls
      if (ball.y <= 0 && ball.vy < 0) { ball.y = 0; ball.vy *= -1; }
      if (ball.y + BALL_SIZE >= H && ball.vy > 0) { ball.y = H - BALL_SIZE; ball.vy *= -1; }

      // Paddle collisions
      if (hitsPaddle(ai) && ball.vx < 0) {
        ball.x = ai.x + PADDLE_W;
        bounceOff(ai);
      }
      if (hitsPaddle(player) && ball.vx > 0) {
        ball.x = player.x - BALL_SIZE;
        bounceOff(player);
      }

      // Scoring
      if (ball.x + BALL_SIZE < 0) {
        player.score++;
        checkWin();
        if (state === 'playing') resetBall(-1);
      }
      if (ball.x > W) {
        ai.score++;
        checkWin();
        if (state === 'playing') resetBall(1);
      }
    }

    function hitsPaddle(p) {
      return ball.x < p.x + PADDLE_W &&
             ball.x + BALL_SIZE > p.x &&
             ball.y < p.y + PADDLE_H &&
             ball.y + BALL_SIZE > p.y;
    }

    function bounceOff(p) {
      // Angle depends on where the ball hits the paddle
      const hit = (ball.y + BALL_SIZE / 2) - (p.y + PADDLE_H / 2);
      const norm = hit / (PADDLE_H / 2);
      const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.05, 14);
      const dir = ball.vx > 0 ? -1 : 1;
      ball.vx = dir * speed * Math.cos(norm * 0.9);
      ball.vy = speed * Math.sin(norm * 0.9);
    }

    function checkWin() {
      if (player.score >= WIN_SCORE) { state = 'over'; winner = 'You win'; }
      else if (ai.score >= WIN_SCORE) { state = 'over'; winner = 'Computer wins'; }
    }

    function glow(color, blur) {
      ctx.shadowColor = color;
      ctx.shadowBlur = blur;
    }

    function draw() {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, W, H);

      // Walls: the border marks the field edge (top/bottom bounce the ball; left/right are goals)
      ctx.strokeStyle = theme.fg;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, W - 4, H - 4);

      // Center line
      ctx.fillStyle = theme.dim;
      for (let y = 0; y < H; y += 28) ctx.fillRect(W / 2 - 2, y, 4, 16);

      // Paddles and ball
      ctx.fillStyle = theme.fg;
      glow(theme.fg, 18);
      ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
      glow('transparent', 0);

      // Score
      ctx.fillStyle = theme.fg;
      ctx.font = '48px monospace';
      ctx.textAlign = 'center';
      glow(theme.fg, 12);
      ctx.fillText(ai.score, W / 2 - 60, 60);
      ctx.fillText(player.score, W / 2 + 60, 60);
      glow('transparent', 0);

      // Overlay text
      if (state !== 'playing') {
        ctx.fillStyle = theme.overlay;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = theme.fg;
        glow(theme.fg, 20);
        ctx.font = '36px monospace';
        const msg = state === 'over' ? winner : 'PONG';
        ctx.fillText(msg, W / 2, H / 2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText(state === 'over' ? 'Click or press Space to play again' : 'Click or press Space to start', W / 2, H / 2 + 24);
        glow('transparent', 0);
      }
    }

    // ---------- Snake ----------
    const CELL = 25;
    const COLS = W / CELL;
    const ROWS = H / CELL;
    const SNAKE_TICK = 100; // ms per move
    const ORANGE = '#ff8c00';
    const ORANGE_HEAD = '#ffb347';

    let snake = [];
    let dir = { x: 1, y: 0 };
    let queue = [];   // buffered turns, so quick key taps aren't lost
    let food = { x: 0, y: 0 };
    let sScore = 0;
    let sBest = 0;
    let sState = 'ready'; // ready | playing | over

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some((c) => c.x === food.x && c.y === food.y));
    }

    function snakeStart() {
      snake = [{ x: 8, y: ROWS / 2 }, { x: 7, y: ROWS / 2 }, { x: 6, y: ROWS / 2 }];
      dir = { x: 1, y: 0 };
      queue = [];
      sScore = 0;
      placeFood();
      sState = 'playing';
    }

    function snakeTurn(dx, dy) {
      if (sState !== 'playing') return;
      const last = queue.length ? queue[queue.length - 1] : dir;
      if (dx === -last.x && dy === -last.y) return; // no reversing
      if (dx === last.x && dy === last.y) return;
      if (queue.length < 2) queue.push({ x: dx, y: dy });
    }

    function snakeUpdate() {
      if (sState !== 'playing') return;
      if (queue.length) dir = queue.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const ate = head.x === food.x && head.y === food.y;
      // The tail moves out of the way unless we're growing
      const body = ate ? snake : snake.slice(0, -1);
      const dead = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
                   body.some((c) => c.x === head.x && c.y === head.y);
      if (dead) {
        sState = 'over';
        sBest = Math.max(sBest, sScore);
        return;
      }
      snake.unshift(head);
      if (ate) {
        sScore++;
        if (snake.length >= COLS * ROWS) { sState = 'over'; sBest = Math.max(sBest, sScore); return; }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function snakeDraw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      // Food
      ctx.fillStyle = '#fff';
      ctx.fillRect(food.x * CELL + 5, food.y * CELL + 5, CELL - 10, CELL - 10);

      // Snake
      glow(ORANGE, 10);
      snake.forEach((c, i) => {
        ctx.fillStyle = i === 0 ? ORANGE_HEAD : ORANGE;
        ctx.fillRect(c.x * CELL + 1, c.y * CELL + 1, CELL - 2, CELL - 2);
      });
      glow('transparent', 0);

      // Walls
      ctx.strokeStyle = ORANGE;
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, W - 4, H - 4);

      // Score
      ctx.fillStyle = ORANGE;
      ctx.font = '20px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('Score ' + sScore, 16, 32);
      ctx.textAlign = 'right';
      ctx.fillText('Best ' + sBest, W - 16, 32);
      ctx.textAlign = 'center';

      if (sState !== 'playing') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = ORANGE;
        glow(ORANGE, 20);
        ctx.font = '36px monospace';
        ctx.fillText(sState === 'over' ? 'Game over: ' + sScore : 'SNAKE', W / 2, H / 2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText(sState === 'over' ? 'Click or press Space to play again' : 'Click or press Space to start (arrows or WASD)', W / 2, H / 2 + 24);
        glow('transparent', 0);
      }
    }

    // ---------- Game switching ----------
    const gameBtn = document.getElementById('game-btn');
    gameBtn.addEventListener('click', () => {
      currentGame = currentGame === 'pong' ? 'snake' : 'pong';
      state = 'ready';   // leaving a game resets it to its start screen
      sState = 'ready';
      acc = 0;
      document.documentElement.dataset.game = currentGame;
      gameBtn.textContent = currentGame === 'pong' ? 'Play Snake' : 'Play Pong';
      gameBtn.blur();
      if (currentGame === 'pong') draw(); else snakeDraw();
    });

    let last = performance.now();
    let acc = 0;
    function loop(ts) {
      const dt = Math.min(ts - last, 500);
      last = ts;
      if (currentGame === 'pong') {
        update();
        draw();
      } else {
        acc += dt;
        while (acc >= SNAKE_TICK) { snakeUpdate(); acc -= SNAKE_TICK; }
        snakeDraw();
      }
      requestAnimationFrame(loop);
    }

    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
